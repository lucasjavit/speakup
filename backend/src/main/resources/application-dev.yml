# Development Profile Configuration
# This file contains settings specific to local development

# Google Authentication (Test Credentials)
google:
  client-id: ${GOOGLE_CLIENT_ID:932414018844-ifeapfombmps2e5f0c518fsq81g7uipu.apps.googleusercontent.com}

# JWT Configuration (weaker secret for dev)
jwt:
  secret: ${JWT_SECRET:dev-jwt-secret-key-not-for-production}

# Stripe Configuration (test mode keys)
stripe:
  api:
    key: ${STRIPE_API_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    public-key: ${STRIPE_PUBLIC_KEY:}
  checkout:
    success-url: ${STRIPE_SUCCESS_URL:http://localhost:3000/credits/success}
    cancel-url: ${STRIPE_CANCEL_URL:http://localhost:3000/credits/buy}

# Logging (more verbose for debugging)
logging:
  level:
    root: INFO
    com.speakup: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

# OpenAPI/Swagger (enabled in dev)
springdoc:
  swagger-ui:
    enabled: true
